[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-video-maker"
version = "0.1.0"
description = "本地运行的自动视频生成桌面应用（MVP）"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "httpx>=0.27",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
auto-video-maker = "auto_video_maker.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
